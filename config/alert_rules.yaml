alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602565
    runbook: docs/alerts.md#alert-1

  - name: HighRequestErrorRate
    severity: critical
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602565
    runbook: docs/alerts.md#alert-2

  - name: LowRetrievalSuccess
    severity: warning
    condition: 'count(tool_success == true) / count(tool_success != null) * 100 < 90'
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602565
    runbook: docs/alerts.md#alert-3
